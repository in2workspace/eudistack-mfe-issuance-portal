openapi: 3.1.0
info:
  title: EUDIStack — Issuance Portal Service · Journey module
  version: "4"
  summary: Journey module of the issuance portal service, used by the issuance portal interface.
  description: |
    The issuance portal service has two modules, each with its own part of the API under the same base URL
    and sharing the journey data: Journey (this contract) and Authentic source.

    The interface identifies the holder with the Verifier (OpenID Connect, authorization code with PKCE) and
    calls the service with the Access Token the Verifier issues, as a Bearer token. The service accepts only
    tokens that are valid, issued by the tenant's Verifier for the portal and with a high level of assurance;
    otherwise it answers 401. It takes the holder's verified identity from the token.

    The journey is linked to the holder of the token. A holder has at most one active journey per tenant, and
    every call works on that journey. The verified identity and the attestation data live only in the service
    and never come from the browser: this module only accepts the email, the code that verifies it and which
    request the holder confirms.

    A journey has one or more requests, for example one per professional registration number of the holder.
    The Authentic source module puts them in the journey, each with an identifier (`request_id`, opaque and
    unique in the journey), its status and, when available, its attestation data. The holder can obtain an
    attestation for each available request in the same journey, without identifying again.

    Before the first confirmation, the holder verifies the email once per journey with a 6-digit code sent to it
    (valid 10 minutes, 5 attempts; a new code voids the previous one). At most one send every 3 minutes, 3 per
    journey and 10 per origin and hour. Every confirmation, issuance request and onboarding ticket of the
    journey uses only that verified email.

    Each request creates at most one issuance process. A new QR is a new credential offer for that same process,
    requested from the issuance API as a system; it voids the previous offer. There is no automatic detection
    that the attestation is saved: when the holder says so on the QR, the interface declares the request saved.

    Journey states: `in_progress`, `completed` (the first offer was delivered) and `withdrawn` (cancelled by the
    holder, not entitled according to the authentic source, or expired after 15 minutes of inactivity, before
    an offer was delivered). A completed journey stays active: the holder can request new QRs and obtain the
    other available requests until the holder ends it (`POST /journey/withdrawal`) or it expires after 15 minutes
    of inactivity. A journey is never deleted. When it ends, is withdrawn or expires, personal data is deleted;
    the journey keeps its state, the step reached and the withdrawal reason.

    A step whose prerequisites are not in the journey gets 409 `step_not_allowed`. A request on a journey that
    was withdrawn, ended or expired gets 410 `journey_closed`. The tenant comes from the host.
  contact:
    name: EUDIStack
    url: https://eudistack.net
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{tenant}.{environment}.eudistack.net/issuance-portal/api/v1
    description: Tenant endpoint.
    variables:
      tenant:
        default: sandbox
      environment:
        default: stg
tags:
  - name: Configuration
    description: Portal configuration of the tenant.
  - name: Journey
    description: Lifecycle of the holder's journey and the issuance of its requests.
  - name: Incidents
    description: Support requests from holders.

paths:
  /config:
    get:
      tags: [Configuration]
      operationId: getPortalConfig
      summary: Get the portal configuration of the tenant
      security: []
      responses:
        "200":
          description: Texts, legal links and support details of the tenant. Branding and languages are not included; the interface takes them from the platform shared assets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalConfig" }
        "503":
          description: "`type` `config_unavailable`: the tenant's portal configuration is missing or invalid."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /journey:
    post:
      tags: [Journey]
      operationId: openJourney
      summary: Open the holder's journey
      description: Opens a journey in progress for the holder of the token, or returns the active one (in progress, or completed and not ended yet).
      security: [{ idpAccessToken: [] }]
      responses:
        "200":
          description: Active journey of the holder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "201":
          description: Journey opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    get:
      tags: [Journey]
      operationId: getJourney
      summary: Get the current journey
      description: |
        State, step reached, email verification and the journey's requests: for each one its identifier, status,
        what the Data step shows and, once delivered, its current offer with the onboarding address and expiries.
      security: [{ idpAccessToken: [] }]
      responses:
        "200":
          description: Current journey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }

  /journey/withdrawal:
    post:
      tags: [Journey]
      operationId: withdrawJourney
      summary: Withdraw the journey
      description: |
        Before the first offer is delivered, the holder cancels: the journey becomes `withdrawn` with the step
        reached and reason `cancelled`, and personal data is deleted. On a `completed` journey, the holder ends it:
        it stays `completed` and personal data is deleted. Either way, later calls get 410 `journey_closed`.
      security: [{ idpAccessToken: [] }]
      responses:
        "200":
          description: Journey withdrawn or ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }

  /journey/email-verification:
    post:
      tags: [Journey]
      operationId: sendEmailCode
      summary: Send a verification code to the holder's email
      description: |
        Requires a confirmed entitlement (at least one available request) and no confirmation yet in the journey:
        the email is verified once per journey, before the first confirmation. Sends a 6-digit code to `email`,
        valid 10 minutes with 5 attempts. A new code voids the previous one, also for another email, and the journey's
        email is no longer verified until the new code is checked (step back to `entitlement_confirmed`).

        At most one send every 3 minutes and 3 sends per journey, plus 10 sends per origin and hour. A send that
        could not go out does not count. The email of the code is written in the language of `Accept-Language`
        when the service has it, and in Spanish otherwise.
      security: [{ idpAccessToken: [] }]
      parameters:
        - name: Accept-Language
          in: header
          required: false
          schema: { type: string }
          description: Language the interface is showing, for the code email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          description: Code sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailVerification" }
        "400":
          description: "`type` `email_required` or `email_invalid`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409": { $ref: "#/components/responses/StepNotAllowed" }
        "429":
          description: |
            No code is sent.
            - `type` `resend_too_soon`: less than 3 minutes since the last send. `Retry-After` gives the seconds left.
            - `type` `too_many_codes`: the journey already sent 3 codes. The holder starts again.
            - `type` `too_many_requests`: 10 sends from the same origin in the last hour. `Retry-After` gives the seconds left.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until another send is allowed. Absent with `too_many_codes`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }
        "503":
          description: "`type` `email_unavailable`: the code email could not be sent. It does not count as a send."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /journey/email-verification/code:
    post:
      tags: [Journey]
      operationId: checkEmailCode
      summary: Check the verification code
      description: |
        Checks the code of the pending verification. If it is right, the email becomes the journey's verified
        email, the code stops working and the step becomes `email_verified`. A wrong code uses one attempt.
      security: [{ idpAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "400":
          description: |
            - `type` `invalid_code`: wrong code; one attempt used.
            - `type` `expired_code`: more than 10 minutes old, or replaced by a newer code.
            - `type` `too_many_attempts`: 5 wrong attempts; the holder asks for another code.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`type` `step_not_allowed`: no code pending in the journey."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }

  /journey/confirmation:
    post:
      tags: [Journey]
      operationId: confirmAndIssue
      summary: Confirm the data of a request and request its issuance
      description: |
        Requires a verified identity, a verified email in the journey and that `request_id` is an `available`
        request of the journey. The body only says which request the holder confirms: any other field is ignored,
        and the attestation data and the email are always the journey's. The verified email is also the holder's
        wallet account email. The service requests issuance of that request with delivery by link and
        authorization code grant, then, if the tenant uses onboarding tickets, requests one from the Wallet Unit
        Service with that email and the offer link. The request becomes `in_offer`. The journey becomes
        `completed` when its first offer is returned, and stays active for the other requests.

        If the Wallet Unit Service rejects the ticket request or does not answer, the service answers 503
        `onboarding_unavailable` and returns no offer. The offer obtained is never used and no attestation is issued.
        A journey without any offer yet stays `in_progress`; the interface calls this operation again.
        Once the request has its issuance process, a repeated confirmation of it does not request issuance again:
        it renews the offer of that process and asks for a new ticket, like `POST /journey/offers`. Retries of the
        issuance request reuse the request's idempotency key.
      security: [{ idpAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestReference" }
      responses:
        "200":
          description: Offer ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400":
          description: "`type` `bad_request`: missing or malformed `request_id`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            - `type` `step_not_allowed`: what the step needs is not in the journey yet (for example, no verified
              email); `request_id` is not a request of the journey, is not available (mismatch or under review) or is
              already saved; or the address already delivered for it has not expired.
            - `type` `request_saved`: the issuance process of the request is no longer a draft (the holder
              collected the attestation, or it was withdrawn or revoked). The request becomes `saved`, no other
              issuance is requested for it and the journey goes on with the other requests.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }
        "502":
          description: "`type` `issuance_rejected`: the issuance API rejected the request."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            - `type` `issuance_unavailable`: the issuance API did not answer after the retries.
            - `type` `onboarding_unavailable`: the tenant uses onboarding tickets and the Wallet Unit Service rejected
              the ticket request or did not answer. No offer is returned.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /journey/offers:
    post:
      tags: [Journey]
      operationId: newOffer
      summary: Request a new offer for a request
      description: |
        For a request with its issuance process, after the address delivered for it expired, or after a previous
        call got `onboarding_unavailable`, while the journey is active. The service asks the issuance API for a
        new credential offer for that request's issuance process, which voids the previous one, and, if the tenant
        uses them, for a new onboarding ticket. No new issuance process is created. If the ticket cannot be
        obtained, it answers 503 `onboarding_unavailable` with no offer and the interface calls this operation
        again. If the address delivered has not expired yet, it answers 409 `step_not_allowed` and the current
        offer keeps working. If the offer can no longer be renewed, the request becomes `saved` (409
        `request_saved`) and the journey goes on.
      security: [{ idpAccessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestReference" }
      responses:
        "200":
          description: New offer ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400":
          description: "`type` `bad_request`: missing or malformed `request_id`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            - `type` `step_not_allowed`: `request_id` is not a request of the journey with an issuance process, it
              is already saved, or the address already delivered for it has not expired.
            - `type` `request_saved`: the issuance process of the request is no longer a draft (the holder
              collected the attestation, or it was withdrawn or revoked). The request becomes `saved`, no other
              issuance is requested for it and the journey goes on with the other requests.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }
        "502":
          description: "`type` `issuance_rejected`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: "`type` `issuance_unavailable`, or `onboarding_unavailable` (no offer is returned)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /journey/requests/{request_id}/saved:
    post:
      tags: [Journey]
      operationId: declareRequestSaved
      summary: Declare the attestation of a request saved
      description: |
        The interface calls it when the holder presses "I have saved it" on the QR of the request. The holder
        declares that the attestation is saved in the wallet. The service does not check it and does not call the
        issuance API: the request becomes `saved` in the journey only. If the holder declared it without saving
        it, a new journey gets the request again as available from the authentic source. Counts as journey
        activity.
      security: [{ idpAccessToken: [] }]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
          description: Identifier of the request in the journey.
      responses:
        "204":
          description: The request is `saved` in the journey. No body.
        "400":
          description: "`type` `bad_request`: malformed `request_id`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`type` `step_not_allowed`: `request_id` is not a request of the journey in `in_offer`, or it has no offer delivered."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/JourneyClosed" }

  /incidents:
    post:
      tags: [Incidents]
      operationId: sendIncident
      summary: Send an incident to the tenant's support
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Incident" }
      responses:
        "202":
          description: Incident sent.
          content:
            application/json:
              schema:
                type: object
                required: [response_time]
                properties:
                  response_time:
                    type: string
                    description: Response time of the tenant's support, as shown to the holder.
        "400":
          description: "`type` `bad_request`: missing or malformed field."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`type` `too_many_requests`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    idpAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token issued by the tenant's Verifier to the issuance portal, with a high level of assurance.

  responses:
    StepNotAllowed:
      description: "`type` `step_not_allowed`: what the step needs is not in the journey yet."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: "`type` `unauthenticated`: missing, expired or invalid Access Token, or level of assurance below high."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    JourneyClosed:
      description: "`type` `journey_closed`: the journey was withdrawn, ended or expired."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    PortalConfig:
      type: object
      required: [texts, support, legal_links, wallet_url, assurance_level]
      properties:
        assurance_level:
          type: string
          enum: [high, substantial]
          description: Level of assurance (eIDAS) the interface asks the Verifier for as essential, and the lowest the service accepts in the Access Token. `high` when the tenant does not configure it.
        login_attestation_scope:
          type: string
          pattern: '^[\x21\x23-\x5B\x5D-\x7E]+$'
          example: doctorid
          description: OAuth scope (RFC 6749 section 3.3) of the attestation the tenant accepts to log in with. The interface adds it to the scope of every authorize, so the Verifier offers the wallet. Absent when the tenant only accepts the certificate.
        wallet_url:
          type: string
          format: uri
          description: Address of the tenant's wallet. Used to build the QR with the offer link when the offer has no `onboarding_url`.
        texts:
          type: object
          additionalProperties: true
          description: Texts of each step, by language.
        support:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: string }
            schedule: { type: string }
            response_time: { type: string }
        legal_links:
          type: object
          properties:
            legal_notice: { type: string, format: uri }
            privacy: { type: string, format: uri }
            terms: { type: string, format: uri }
            accessibility: { type: string, format: uri }

    Journey:
      type: object
      required: [state, step]
      properties:
        state:
          type: string
          enum: [in_progress, completed, withdrawn]
        step:
          type: string
          enum: [identified, entitlement_confirmed, email_verified, offer_obtained]
          description: Last step reached.
        withdrawal_reason:
          type: string
          enum: [cancelled, not_entitled, expired]
          description: Only with `withdrawn`.
        known_email:
          type: string
          format: email
          description: Email the Access Token or the authentic source provided, to prefill the email step. It still needs the code.
        email_verification:
          $ref: "#/components/schemas/EmailVerification"
        requests:
          type: array
          description: The journey's requests, once the Authentic source module put them in the journey.
          items:
            $ref: "#/components/schemas/JourneyRequest"

    RequestReference:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          maxLength: 64
          description: Identifier of the request in the journey, as the journey returns it.

    JourneyRequest:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          maxLength: 64
          description: Identifier of the request in the journey, assigned by the Authentic source module. Opaque, with no personal data.
        status:
          type: string
          enum: [available, in_offer, saved, not_available]
          description: |
            - `available`: the holder can confirm it.
            - `in_offer`: confirmed; its issuance process exists and the holder has, or can request, a QR.
            - `saved`: the holder declared its attestation saved (`POST /journey/requests/{request_id}/saved`), or
              its offer can no longer be renewed (409 `request_saved`).
            - `not_available`: it cannot be issued in this journey; `not_available_reason` says why.
        not_available_reason:
          type: string
          enum: [identifier_mismatch, identity_mismatch, under_review]
          description: Only with `not_available`, the status the Authentic source module gave the request. `under_review` once the holder said its data is not correct.
        requested_by:
          type: string
          description: Who asked for it, when the authentic source gives it.
        requested_at:
          type: string
          format: date-time
          description: When it was asked for, when the authentic source gives it.
        renewal:
          type: boolean
          description: True when it renews an attestation the holder already had, when the authentic source gives it.
        organization:
          type: string
          description: Organization the request belongs to, as the authentic source gives it. Absent when the source does not give it.
        display_identifier:
          type: string
          description: Identifier that lets the holder recognise the request, for example a registration number. Absent when the source does not give one. Not the request `id`, and never sent back by the interface.
        attestation:
          $ref: "#/components/schemas/AttestationPreview"
        offer:
          $ref: "#/components/schemas/Offer"

    EmailVerification:
      type: object
      description: |
        The email of the pending or completed verification. Present once a code has been sent, until the journey
        ends. One per journey: it serves every request.
      required: [email, verified, resend_available_at, sends_left]
      properties:
        email:
          type: string
          format: email
          description: The email the code was sent to, the holder's own.
        verified:
          type: boolean
          description: True once the right code has been checked.
        code_expires_at:
          type: string
          format: date-time
          description: Only while a code is pending.
        resend_available_at:
          type: string
          format: date-time
          description: From when another code can be sent.
        sends_left:
          type: integer
          minimum: 0
          maximum: 3
          description: Codes the journey can still send.

    AttestationPreview:
      type: object
      description: What the interface shows in the Data step of a request. Read only. Present with `available` and `in_offer`.
      required: [type_name, fields]
      properties:
        type_name: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }

    Offer:
      type: object
      description: |
        The current offer of a request. With `onboarding_url`, the QR, the button and the copy link carry it as is. Without it (the tenant does not
        use onboarding tickets), the interface builds the tenant's wallet address with `wallet_url` and the offer link.
      required: [credential_offer_uri, expires_at]
      properties:
        credential_offer_uri:
          type: string
          description: Offer link exactly as returned by the issuance API.
        expires_at:
          type: string
          format: date-time
        onboarding_url:
          type: string
          format: uri
          description: |
            Onboarding address returned by the Wallet Unit Service: the tenant's wallet host and a short single-use
            ticket, with no other data. The Wallet Unit Service keeps the email and the offer with the ticket. Always
            present when the tenant uses onboarding tickets, absent otherwise.
          example: https://wallet.example/t/Zk3q9Xw2Lp7Rt4Vb8Nc1Ha
        onboarding_expires_at:
          type: string
          format: date-time
          description: Earlier than `expires_at`. Present with `onboarding_url`.

    Incident:
      type: object
      required: [name, email, type, subject, description]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
        type:
          type: string
          enum: [technical, access, credentials, other]
        subject: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }

    Problem:
      type: object
      description: Problem details (RFC 9457 shape). `type` is an error code.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
