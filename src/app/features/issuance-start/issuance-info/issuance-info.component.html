<main class="flex min-h-screen flex-col items-center justify-center gap-6 px-6 text-center">
  @if (!cannotContinue()) {
    <h1 class="text-2xl font-semibold text-gray-900">{{ 'issuanceInfo.title' | translate }}</h1>
    <p class="max-w-md text-gray-600">{{ 'issuanceInfo.description' | translate }}</p>
    <button
      type="button"
      class="min-h-[44px] min-w-[44px] rounded-md bg-blue-600 px-6 py-3 font-medium text-white hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
      [attr.aria-label]="'issuanceInfo.cta.ariaLabel' | translate"
      (click)="onStart()"
    >
      {{ 'issuanceInfo.cta' | translate }}
    </button>
  } @else {
    <h1 class="text-2xl font-semibold text-gray-900">{{ 'issuanceInfo.cannotContinue.title' | translate }}</h1>
    <p class="max-w-md text-gray-600">{{ 'issuanceInfo.cannotContinue.description' | translate }}</p>
    <button
      type="button"
      class="min-h-[44px] min-w-[44px] rounded-md bg-blue-600 px-6 py-3 font-medium text-white hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
      (click)="onRetry()"
    >
      {{ 'issuanceInfo.cannotContinue.retry' | translate }}
    </button>
  }
</main>
