<main class="min-h-screen bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="mx-auto flex max-w-lg flex-col items-center gap-6 rounded-xl border bg-white p-8 text-center" role="status">
    <div class="flex h-16 w-16 items-center justify-center rounded-full bg-green-100">
      <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">{{ 'incidents.sent.title' | translate }}</h1>
    <p class="text-gray-600" data-testid="incident-sent-response-time">
      {{ 'incidents.sent.responseTime' | translate: { responseTime: responseTime() } }}
    </p>
    <button
      type="button"
      (click)="onHome()"
      class="inline-flex h-10 items-center justify-center rounded-md bg-brand-secondary px-6 text-sm font-medium text-brand-secondary-contrast transition-colors hover:opacity-90"
    >
      {{ 'incidents.sent.home' | translate }}
    </button>
  </div>
</main>
