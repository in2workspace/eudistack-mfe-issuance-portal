<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex items-center gap-6">
        <button (click)="onBack()" class="inline-flex items-center justify-center h-9 w-9 rounded-md text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
        <img [src]="branding.logoUrl()" [alt]="branding.appName()" class="h-12 w-auto" />
        <div class="border-l border-gray-300 pl-6">
          <p class="text-sm font-medium text-gray-700">Cartera de Identidad Digital</p>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center mb-12">
      <div class="w-20 h-20 bg-brand-secondary rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10 text-brand-secondary-contrast" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h2 class="text-3xl font-bold text-gray-900 mb-4">Autenticación Segura</h2>
      <p class="text-xl text-gray-600 max-w-2xl mx-auto">
        Selecciona tu método preferido de autenticación. Todos los métodos son igualmente seguros.
      </p>
    </div>

    <div class="grid gap-6 mb-8">
      @for (method of authMethods; track method.id) {
        <button
          type="button"
          (click)="selectMethod(method.id)"
          class="bg-card text-card-foreground flex flex-col gap-6 rounded-xl border p-6 text-left cursor-pointer hover:shadow-lg transition-all hover:border-brand-accent relative"
        >
          @if (method.recommended) {
            <div class="absolute top-4 right-4">
              <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">
                Recomendado
              </span>
            </div>
          }
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 bg-brand-secondary rounded-lg flex items-center justify-center flex-shrink-0">
              @if (method.id === 'certificate' || method.id === 'doctorId') {
                <svg class="w-7 h-7 text-brand-secondary-contrast" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
              }
              @if (method.id === 'eDNI') {
                <svg class="w-7 h-7 text-brand-secondary-contrast" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2 10h20M6 15h2m3 0h5M4 6h16a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z" />
                </svg>
              }
              @if (method.id === 'claveMobile') {
                <svg class="w-7 h-7 text-brand-secondary-contrast" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
              }
              @if (method.id === 'video') {
                <svg class="w-7 h-7 text-brand-secondary-contrast" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              }
            </div>
            <div class="flex-1">
              <h3 class="font-bold text-gray-900 mb-2">{{ method.title }}</h3>
              <p class="text-gray-600 mb-4">{{ method.description }}</p>
              <div class="flex items-center gap-2 text-brand-accent">
                <span class="font-semibold">Seleccionar este método</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </div>
            </div>
          </div>
        </button>
      }
    </div>
  </div>
</div>
