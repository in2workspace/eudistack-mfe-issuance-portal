<div class="min-h-screen flex flex-col">
  <app-acme-header />

  <!-- Área principal: imagen de fondo + card de login -->
  <main
    class="flex-1 relative flex items-center justify-center py-12 px-4"
    style="background-image: url('/acme-bg.png'); background-size: cover; background-position: center;"
  >
    <!-- Overlay semitransparente -->
    <div class="absolute inset-0 z-0" style="background: rgba(26, 82, 118, 0.55);" aria-hidden="true"></div>

    <!-- Card de login -->
    <div class="relative z-10 bg-white rounded-xl shadow-2xl w-full max-w-md p-8">
      <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Acceso</h1>
      <p class="text-sm text-gray-500 text-center mb-3">Para acceder introduce tu usuario y tu contraseña.</p>

      <div class="text-center mb-6">
        <a href="#" (click)="$event.preventDefault()" class="text-sm text-[#2874A6] hover:underline">
          Necesito ayuda para acceder
        </a>
      </div>

      <div class="space-y-5">
        <div>
          <label for="acme-usuario" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input
            id="acme-usuario"
            type="text"
            autocomplete="username"
            readonly
            placeholder="Introduce tu usuario"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 bg-white focus:outline-none focus:ring-2 focus:ring-[#2874A6] focus:border-[#2874A6]"
          />
        </div>
        <div>
          <label for="acme-password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input
            id="acme-password"
            type="password"
            autocomplete="current-password"
            readonly
            placeholder="Introduce tu contraseña"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 bg-white focus:outline-none focus:ring-2 focus:ring-[#2874A6] focus:border-[#2874A6]"
          />
        </div>

        <!-- Botón Entrar — no-op (maqueta visual) -->
        <div class="flex justify-center">
          <button
            type="button"
            class="px-10 py-2 border-2 border-[#1A5276] text-[#1A5276] font-semibold rounded-md text-sm hover:bg-[#1A5276] hover:text-white transition-colors"
          >
            Entrar
          </button>
        </div>

        <!-- Recuérdame — no-op -->
        <div class="flex justify-center">
          <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-[#2874A6] focus:ring-[#2874A6]" />
            Recuérdame
          </label>
        </div>
      </div>

      <!-- Divisor -->
      <div class="flex items-center gap-3 my-5">
        <hr class="flex-1 border-gray-300" />
        <span class="text-xs text-gray-400">o</span>
        <hr class="flex-1 border-gray-300" />
      </div>

      <!-- Acceso con DoctorID — inicia flujo OIDC PKCE (HU-010) -->
      <button
        type="button"
        (click)="onIniciarFlujoOIDC()"
        class="w-full flex items-center justify-center gap-3 px-4 py-10 rounded-md bg-[#E67E22] text-white text-sm font-semibold hover:bg-[#D35400] transition-colors"
      >
        Acceso con DoctorID
      </button>
    </div>
  </main>

  <app-acme-footer />
</div>
