<header class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto flex items-center gap-3 px-4 py-3 sm:gap-6 sm:px-6 lg:px-8">
    @if (backTo() !== null) {
      <button
        type="button"
        (click)="onBack()"
        [attr.aria-label]="'header.back' | translate"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-gray-600 transition-colors hover:bg-gray-100"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
    }
    <img
      [src]="branding.logoUrl()"
      [alt]="'header.logoAlt' | translate"
      class="h-8 w-auto min-w-0 max-w-[40%] object-contain object-left sm:h-12 sm:max-w-none"
    />
    <p class="min-w-0 flex-1 truncate border-l border-gray-300 pl-3 text-sm font-medium text-gray-700 sm:pl-6">
      {{ 'portal.app_name' | translate }}
    </p>
    @if (language.supported().length > 0) {
      <label for="portal-language" class="sr-only">{{ 'header.language' | translate }}</label>
      <select
        id="portal-language"
        (change)="onLanguageChange($event)"
        class="shrink-0 rounded-md border border-gray-300 bg-white px-2 py-1 text-sm text-gray-700"
      >
        @for (lang of language.supported(); track lang) {
          <option [value]="lang" [selected]="lang === language.current()">{{ lang.toUpperCase() }}</option>
        }
      </select>
    }
  </div>
</header>
